# DSH-Mod bundle patch.
#
# Applied after the profile's in-box bundle layers (dsh-base then dsh-web-app)
# and before the profile/user cordis.patch.yml layers.
#
# Both optional workspace RPCs use the upstream browser trust fence.
# Client entries use conversation.input.overlay and conversation.session.header.actions.
# Configure hashFileSearch/openWorkspaceFolder/repoStatus on this row to retire a feature.
# Older forks mounting their own ui-files should disable that row in their own profile.
# The native Models provider cards check account access before saving provider routes.

# Keep the row id stable: profile overlays can target it as `dsh-mod`.
- insert:
    - id: dsh-mod
      name: '@vent0s/dsh-mod-workspace-files'
